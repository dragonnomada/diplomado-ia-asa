<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Hola App</title>
        <style>
            img {
                width: 100%;
            }
        </style>
    </head>
    <body>
        <h1>Bienvenido</h1>

        <div>
            <img src="/graficas/titanic/sexo_vs_supervivencia" >
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Sex</th>
                        <th>Age</th>
                        <th>Pclass</th>
                        <th>Fare</th>
                        <th>SibSp</th>
                        <th>Parch</th>
                        <th>Cabin</th>
                        <th>Embarked</th>
                        <th>Survived</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <button onclick="load_data()">Cargar datos</button>
        </div>
        <script>
            async function load_data() {
                const response = await fetch("/datos/titanic")
                if (response.ok) {
                    const result = await response.json()
                    console.log(result)
                    const tbody = document.querySelector("tbody")
                    tbody.innerHTML = ""
                    for (const record of result) {
                        const tr = document.createElement("tr")
                        tr.innerHTML = `
                            <td>${record.PassengerId}</td>
                            <td>${record.Name}</td>
                            <td>${record.Sex}</td>
                            <td>${record.Age}</td>
                            <td>${record.Pclass}</td>
                            <td>${record.Fare}</td>
                            <td>${record.SibSp}</td>
                            <td>${record.Parch}</td>
                            <td>${record.Cabin}</td>
                            <td>${record.Embarked}</td>
                            <td>${record.Survived}</td>
                        `
                        tbody.appendChild(tr)
                    }
                } else {
                    const error = await response.text()
                    alert(error)
                    console.warn(error)
                }
            }
        </script>
    </body>
</html>
